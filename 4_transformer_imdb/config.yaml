batch_size: 64
checkpoint:
  archive_under_runs: true
  root_dir: checkpoints
  save_best: true
  save_every_n_epochs: 5
  save_last: true
data:
  folder: ./data/aclImdb
device: auto
epochs: 10
learning_rate: 0.0001
log_metrics: true
model:
  d_model: 128
  dim_feedforward: 512
  dropout: 0.1
  max_len: 256
  nhead: 8
  num_classes: 2
  num_layers: 3
  vocab_size: 25000
optimizer:
  name: Adam
  weight_decay: 0.0
runs_dir: runs
save_summary: true
scheduler:
  gamma: 0.8
  name: StepLR
  step_size: 3
seed: 42
